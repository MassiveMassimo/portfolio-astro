name = "portfolio-astro"
compatibility_date = "2024-09-23"

# Enable Node.js compatibility for sharp/image processing
compatibility_flags = ["nodejs_compat"]

# Specify the main entry point to the worker script
main = "dist/_worker.js/index.js"

# Define the Durable Object namespace
[[durable_objects.bindings]]
name = "CURSOR_ROOM"
class_name = "CursorRoom"

# Migrations are required for Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CursorRoom"]

# KV Namespace for Sessions (Uncomment if you use sessions)
# [[kv_namespaces]]
# binding = "SESSION"
# id = "657755ec2e4b4aaa81b1493a7a444f00"
