name = "portfolio-astro"
compatibility_date = "2024-09-23"
# main = "dist/_worker.js/index.js" # Points to Astro's worker build output (COMMENTED OUT: Use pages_build_output_dir)
pages_build_output_dir = "dist"

# Define the Durable Object namespace
[[durable_objects.bindings]]
name = "CURSOR_ROOM"
class_name = "CursorRoom"

# Migrations are required for Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CursorRoom"]
